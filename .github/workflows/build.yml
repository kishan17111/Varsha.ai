name: Build and publish APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Accept Android SDK licences and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }

      - name: Unit tests (blocking only on release tags)
        run: gradle :app:testDebugUnitTest
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      # No API keys anywhere. KEYSTORE_* only sign the APK so it can be verified and updated.
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk varsha.apk
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs varsha.apk
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Public releases must be signed. Add the KEYSTORE_* secrets (see README.md)."
              exit 1
            fi
            gradle :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk varsha.apk
          fi
          sha256sum varsha.apk > varsha.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: varsha-apk
          path: |
            varsha.apk
            varsha.apk.sha256
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish APK to the public repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ${{ secrets.PUBLIC_REPO }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" varsha.apk varsha.apk.sha256 --repo "$PUBLIC_REPO" \
            --title "Varsha $TAG" --notes "Download varsha.apk, then see the README for install steps." \
          || gh release upload "$TAG" varsha.apk varsha.apk.sha256 --clobber --repo "$PUBLIC_REPO"
